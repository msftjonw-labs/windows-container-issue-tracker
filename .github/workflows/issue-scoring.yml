name: "Calculate Issue Priority Scores"

on:
  schedule:
    - cron: '0 17 * * 1' # Runs every Monday at 17:00 UTC
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send scoring and hypothesis report status with available PDFs"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: issue-scoring-project
  cancel-in-progress: false

jobs:
  score-issues:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      scoring_status: ${{ steps.scoring.outcome }}
      report_status: ${{ steps.hypothesis.outcome }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Clear historical files from this run's artifact inputs
        run: |
          rm -f snapshot-history/windows-container-issue-snapshot-*.pdf
          rm -f report-history/windows-container-hypothesis-validation-*.pdf
          rm -f scoring-output/scored-issues.json

      # Generates a dynamic token for msftjonw-labs organization and public repo reads
      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Scoring Script
        id: scoring
        env:
          # Single App Token used for both public repository queries and Project v2 updates
          GITHUB_APP_TOKEN: ${{ steps.generate-app-token.outputs.token }}

          # Organization & Project details
          ORGANIZATION_NAME: "msftjonw-labs"
          PROJECT_NUMBER: 1
          
          # Project v2 Custom Fields
          CUSTOM_FIELD_NAME: "Priority Score"
          REPO_FIELD_NAME: "Source"

          # Publish a durable digest only after a scheduled refresh completes
          DIGEST_REPOSITORY: "msftjonw-labs/windows-container-issue-tracker"
          DIGEST_LABELS: "weekly-digest"
          PUBLISH_WEEKLY_DIGEST: ${{ github.event_name == 'schedule' }}
          GITHUB_WORKFLOW_RUN_URL: >-
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Target public repositories
          TARGET_REPOS: >-
            kubernetes/kubernetes,
            kubernetes/enhancements,
            kubernetes/community,
            kubernetes/minikube,
            helm/helm,
            prometheus/prometheus,
            containerd/containerd,
            containerd/nerdctl,
            moby/moby,
            moby/buildkit,
            envoyproxy/envoy,
            argoproj/argo-cd,
            docker/for-win,
            microsoft/Windows-Containers,
            microsoft/windows-container-tools,
            microsoft/containers-toolkit,
            Azure/AKS
        run: python scripts/calculate_scores.py

      - name: Generate hypothesis validation report
        id: hypothesis
        env:
          GITHUB_APP_TOKEN: ${{ steps.generate-app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HYPOTHESIS_EXCLUDED_OWNERS: ${{ vars.HYPOTHESIS_EXCLUDED_OWNERS }}
        run: python scripts/hypothesis_state.py

      - name: Upload issue snapshot
        if: ${{ always() && steps.scoring.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-history/*.pdf
          if-no-files-found: error

      - name: Upload hypothesis report
        if: ${{ always() && steps.hypothesis.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: report-history/*.pdf
          if-no-files-found: error

  publish-issue-snapshot:
    needs: score-issues
    if: ${{ always() && !cancelled() && needs.score-issues.outputs.scoring_status == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download issue snapshot
        uses: actions/download-artifact@v4
        with:
          name: issue-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot-history

      - name: Commit and push issue snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- snapshot-history/*.pdf
          if git diff --cached --quiet; then
            echo "Issue snapshot is already committed."
            exit 0
          fi
          git commit -m "Archive issue snapshot for run ${GITHUB_RUN_ID}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish-hypothesis-report:
    needs: score-issues
    if: ${{ always() && !cancelled() && needs.score-issues.outputs.report_status == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download hypothesis report
        uses: actions/download-artifact@v4
        with:
          name: hypothesis-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: report-history

      - name: Commit and push hypothesis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- report-history/*.pdf
          if git diff --cached --quiet; then
            echo "Hypothesis report is already committed."
            exit 0
          fi
          git commit -m "Archive hypothesis report for run ${GITHUB_RUN_ID}" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  email-weekly-status:
    needs: score-issues
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download issue snapshot
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: issue-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download hypothesis report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hypothesis-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Email scoring and report status
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          WEEKLY_EMAIL_RECIPIENTS: ${{ vars.WEEKLY_EMAIL_RECIPIENTS }}
          RUN_STATUS: ${{ needs.score-issues.outputs.scoring_status || needs.score-issues.result }}
          REPORT_STATUS: ${{ needs.score-issues.outputs.report_status || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_URL: https://github.com/orgs/msftjonw-labs/projects/1
          SNAPSHOT_DIRECTORY: ${{ runner.temp }}/snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          REPORT_DIRECTORY: ${{ runner.temp }}/report-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/notify_run_status.py