name: "Calculate Issue Priority Scores"

on:
  schedule:
    - cron: '0 17 * * 1' # Runs every Monday at 17:00 UTC
  workflow_dispatch:
    inputs:
      send_weekly_email:
        description: "Send the digest email during this manual run"
        required: true
        default: false
        type: boolean

jobs:
  score-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      # Generates a dynamic token for msftjonw-labs organization and public repo reads
      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Scoring Script
        env:
          # Single App Token used for both public repository queries and Project v2 updates
          GITHUB_APP_TOKEN: ${{ steps.generate-app-token.outputs.token }}

          # Organization & Project details
          ORGANIZATION_NAME: "msftjonw-labs"
          PROJECT_NUMBER: 1
          
          # Project v2 Custom Fields
          CUSTOM_FIELD_NAME: "Priority Score"
          REPO_FIELD_NAME: "Source"

          # Publish a durable digest only after a scheduled refresh completes
          DIGEST_REPOSITORY: "msftjonw-labs/windows-container-issue-tracker"
          DIGEST_LABELS: "weekly-digest,ready-to-email"
          PUBLISH_WEEKLY_DIGEST: ${{ github.event_name == 'schedule' }}
          SEND_WEEKLY_EMAIL: >-
            ${{ github.event_name == 'schedule' || inputs.send_weekly_email }}
          GITHUB_WORKFLOW_RUN_URL: >-
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Target public repositories
          TARGET_REPOS: >-
            kubernetes/kubernetes,
            kubernetes/enhancements,
            kubernetes/community,
            kubernetes/minikube,
            helm/helm,
            prometheus/prometheus,
            containerd/containerd,
            containerd/nerdctl,
            moby/moby,
            moby/buildkit,
            envoyproxy/envoy,
            argoproj/argo-cd,
            docker/for-win,
            microsoft/Windows-Containers,
            microsoft/windows-container-tools,
            microsoft/containers-toolkit,
            Azure/AKS
        run: python scripts/calculate_scores.py

      - name: Upload Email Payload
        if: ${{ github.event_name == 'schedule' || inputs.send_weekly_email }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-email-payload
          path: weekly-email-payload.json

  send-weekly-email:
    needs: score-issues
    if: ${{ github.event_name == 'schedule' || inputs.send_weekly_email }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Email Payload
        uses: actions/download-artifact@v4
        with:
          name: weekly-email-payload

      - name: Send Weekly Email
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "465"
          SMTP_SECURITY: "ssl"
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ vars.SMTP_FROM_ADDRESS }}
          WEEKLY_EMAIL_RECIPIENTS: ${{ vars.WEEKLY_EMAIL_RECIPIENTS }}
        run: python scripts/send_weekly_email.py weekly-email-payload.json