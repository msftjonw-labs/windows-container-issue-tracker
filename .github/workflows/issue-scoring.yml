name: "Calculate Issue Priority Scores"

on:
  schedule:
    - cron: "0 */6 * * *" # Triggers automatically every 6 hours
  workflow_dispatch: # Enables manual trigger button in GitHub UI

jobs:
  score-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scoring Script
        env:
          # GitHub App Installation Token for both reading public repos & writing to Project v2
          GITHUB_TOKEN: ${{ steps.generate-app-token.outputs.token }}

          # YOUR PERSONAL GITHUB USERNAME
          ORGANIZATION_NAME: "msftjonw"

          # YOUR PERSONAL PROJECT V2 BOARD NUMBER
          PROJECT_NUMBER: 1
          CUSTOM_FIELD_NAME: "Priority Score"

          # PUBLIC TARGET REPOSITORIES
          TARGET_REPOS: >-
            kubernetes/kubernetes,
            kubernetes/enhancements,
            kubernetes/community,
            helm/helm,
            prometheus/prometheus,
            containerd/containerd,
            moby/moby,
            envoyproxy/envoy,
            argoproj/argo-cd,
            docker/for-win
        run: python scripts/calculate_scores.py