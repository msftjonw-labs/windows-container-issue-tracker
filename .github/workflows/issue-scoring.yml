name: "Calculate Issue Priority Scores"

on:
  schedule:
    - cron: "0 */6 * * *" # Triggers automatically every 6 hours
  workflow_dispatch: # Enables manual trigger button in GitHub UI

jobs:
  score-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests azure-ai-textanalytics azure-identity

      - name: Run Scoring Script
        env:
          # PAT for writing to your Personal GitHub Project v2 board
          GH_PAT: ${{ secrets.GH_PROJECTS_PAT }}

          # PAT for querying Microsoft/Azure enterprise public repositories
          # MSFT_PAT: ${{ secrets.MSFT_ENTERPRISE_PAT }}

          # YOUR PERSONAL GITHUB USERNAME
          ORGANIZATION_NAME: "your-personal-github-username"

          # YOUR PERSONAL PROJECT V2 BOARD NUMBER
          PROJECT_NUMBER: 1
          CUSTOM_FIELD_NAME: "Priority Score"

          # PUBLIC TARGET REPOSITORIES
          TARGET_REPOS: >-
            kubernetes/kubernetes,
            kubernetes/enhancements,
            kubernetes/community,
            helm/helm,
            prometheus/prometheus,
            containerd/containerd,
            moby/moby,
            envoyproxy/envoy,
            argoproj/argo-cd,
            docker/for-win,
            microsoft/Windows-Containers,
            microsoft/windows-container-tools,
            Azure/AKS
        run: python scripts/calculate_scores.py