name: "Calculate Issue Priority Scores"

on:
  schedule:
    - cron: '0 17 * * 1' # Runs every Monday at 17:00 UTC
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send an email after issue scoring succeeds"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: issue-scoring-project
  cancel-in-progress: false

jobs:
  score-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      # Generates a dynamic token for msftjonw-labs organization and public repo reads
      - name: Generate GitHub App Token
        id: generate-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Scoring Script
        env:
          # Single App Token used for both public repository queries and Project v2 updates
          GITHUB_APP_TOKEN: ${{ steps.generate-app-token.outputs.token }}

          # Organization & Project details
          ORGANIZATION_NAME: "msftjonw-labs"
          PROJECT_NUMBER: 1
          
          # Project v2 Custom Fields
          CUSTOM_FIELD_NAME: "Priority Score"
          REPO_FIELD_NAME: "Source"

          # Publish a durable digest only after a scheduled refresh completes
          DIGEST_REPOSITORY: "msftjonw-labs/windows-container-issue-tracker"
          DIGEST_LABELS: "weekly-digest"
          PUBLISH_WEEKLY_DIGEST: ${{ github.event_name == 'schedule' }}
          GITHUB_WORKFLOW_RUN_URL: >-
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Target public repositories
          TARGET_REPOS: >-
            kubernetes/kubernetes,
            kubernetes/enhancements,
            kubernetes/community,
            kubernetes/minikube,
            helm/helm,
            prometheus/prometheus,
            containerd/containerd,
            containerd/nerdctl,
            moby/moby,
            moby/buildkit,
            envoyproxy/envoy,
            argoproj/argo-cd,
            docker/for-win,
            microsoft/Windows-Containers,
            microsoft/windows-container-tools,
            microsoft/containers-toolkit,
            Azure/AKS
        run: python scripts/calculate_scores.py

      - name: Upload issue snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-snapshot-${{ github.run_id }}
          path: snapshot-history/*.pdf
          if-no-files-found: error

  email-weekly-status:
    needs: score-issues
    if: ${{ needs.score-issues.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download issue snapshot
        uses: actions/download-artifact@v4
        with:
          name: issue-snapshot-${{ github.run_id }}
          path: snapshot-history

      - name: Email successful run status
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          WEEKLY_EMAIL_RECIPIENTS: ${{ vars.WEEKLY_EMAIL_RECIPIENTS }}
          RUN_STATUS: ${{ needs.score-issues.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_URL: https://github.com/orgs/msftjonw-labs/projects/1
          SNAPSHOT_DIRECTORY: snapshot-history
        run: python3 scripts/notify_run_status.py